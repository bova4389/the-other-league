name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'Sleeper FF/The Other League/**'
  # Commits pushed by a bot job using the default GITHUB_TOKEN do NOT fire
  # `push` workflows — GitHub blocks that to stop workflows recursing. So the
  # KTC and projections bots would commit their data files and the live site
  # would never pick them up. Chaining off workflow_run is what actually
  # publishes them. Don't remove this thinking `push` already covers it.
  workflow_run:
    workflows: ["Daily Projections Update", "Weekly KTC Values Update"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # workflow_run fires on completion regardless of outcome — don't redeploy
    # off the back of a bot run that failed.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'Sleeper FF/The Other League'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
