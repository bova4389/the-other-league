name: Weekly KTC Values Update

on:
  schedule:
    # Every Monday at noon UTC (8 AM ET) — fresh values for the week
    - cron: '0 12 * * 1'
  # ALLOW-list, not paths-ignore (fixed 2026-08-20). `paths-ignore` only skips a
  # push whose files are ALL ignored, so every ordinary code push — index.html,
  # CLAUDE.md, anything — fired a full KTC scrape. Confirmed in the log: four
  # consecutive code pushes each produced an immediate `chore(bot)` commit, and
  # each of those redeployed Pages via the workflow_run chain below. The scrape
  # now costs ~7 extra requests (the deep-lookup pass), so this churn is not
  # free. Scheduled cron + manual dispatch are the intended cadence; the only
  # push worth reacting to is a change to the scraper itself.
  push:
    branches: [main]
    paths:
      - 'Sleeper FF/The Other League/scripts/fetch_ktc.py'
  workflow_dispatch:
    # Manual trigger from GitHub Actions UI for on-demand refresh

jobs:
  update-ktc:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch KTC values
        run: python "Sleeper FF/The Other League/scripts/fetch_ktc.py"

      - name: Commit and push
        run: |
          git config user.name "ktc-bot"
          git config user.email "ktc-bot@the-other-league"
          git add "Sleeper FF/The Other League/ktc-values.json"
          if git diff --staged --quiet; then
            echo "✓ No changes — ktc-values.json is already up to date."
          else
            git commit -m "chore(bot): update KTC dynasty values [automated]"
            git push
            echo "✓ Pushed updated KTC values."
          fi
