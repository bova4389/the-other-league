name: Tuesday Weekly H2H Update

on:
  schedule:
    # Every Tuesday at 1:00 PM UTC (9:00 AM ET) — after Monday Night Football
    - cron: '0 13 * * 2'
  workflow_dispatch:
    # Manual trigger from GitHub Actions UI — useful for testing or catch-up runs
    inputs:
      week:
        description: 'NFL week to process (leave blank to auto-detect from Sleeper)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run — print changes without writing files'
        required: false
        default: 'false'
        type: boolean
      force:
        description: 'Force re-processing even if week was already applied'
        required: false
        default: 'false'
        type: boolean

jobs:
  update-h2h:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to commit and push h2h-records.md

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run Tuesday update script
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.week }}" ]; then
            ARGS="$ARGS --week ${{ github.event.inputs.week }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          python "Sleeper FF/The Other League/scripts/tuesday_update.py" $ARGS

      - name: Commit and push changes
        run: |
          git config user.name "tuesday-bot"
          git config user.email "tuesday-bot@the-other-league"
          git add "Sleeper FF/The Other League/h2h-records.md" "Sleeper FF/The Other League/scripts/bot_state.json"
          if git diff --staged --quiet; then
            echo "✓ No changes — h2h-records.md is already up to date."
          else
            # Kept to ONE line on purpose. This was a multi-line `python -c "` whose
            # body sat at column 0 inside this `run: |` block — which dedents out of
            # the YAML block scalar and made the whole workflow file unparseable, so
            # this bot never ran once between its 2026-06 commit and 2026-09-03. Any
            # line here must stay indented to the block; do not paste a script body in.
            # The path is also repo-root-relative (it read 'scripts/bot_state.json').
            WEEK=$(python -c "import json,os; f='Sleeper FF/The Other League/scripts/bot_state.json'; d=json.load(open(f)) if os.path.exists(f) else {}; w=d.get('applied_weeks',[]); print(max(w) if w else '?')")
            git commit -m "chore(bot): H2H records update — 2026 Week ${WEEK} [automated]"
            git push
            echo "✓ Pushed H2H records update for Week ${WEEK}."
          fi

      # ── Phase 12 data chain ────────────────────────────────────────────────
      # THE ORDER OF THESE THREE STEPS IS LOAD-BEARING:
      #   stats-history.json  ->  replacement-levels.json  ->  trade-roi.json
      # Each reads the one before it. Getting it wrong is not a loud failure:
      # build_trade_roi.py skips any week it has no replacement baseline for
      # (`base is None -> continue`), so running it against stale baselines would
      # publish a file in which the whole live season silently scored zero, with
      # nothing anywhere to trace it back to. build_trade_roi.py now refuses to run
      # against incomplete coverage, which is the backstop for exactly that.
      #
      # All three run AFTER the H2H commit on purpose — a data failure must not cost
      # us the H2H update that already succeeded — and each is gated on the previous
      # one so a broken link stops the chain instead of feeding it garbage.
      - name: Update stats-history.json (live season)
        id: stats
        continue-on-error: true
        run: python "Sleeper FF/The Other League/generate_stats.py" --live-only

      - name: Update replacement-levels.json (live season)
        id: repl
        if: steps.stats.outcome == 'success'
        continue-on-error: true
        run: python "Sleeper FF/The Other League/scripts/build_replacement_levels.py" --live-only

      - name: Rebuild trade-roi.json
        id: roi
        if: steps.repl.outcome == 'success'
        continue-on-error: true
        run: python "Sleeper FF/The Other League/scripts/build_trade_roi.py"

      - name: Commit and push Phase 12 data files
        if: always()
        run: |
          git config user.name "tuesday-bot"
          git config user.email "tuesday-bot@the-other-league"
          git add "Sleeper FF/The Other League/stats-history.json" \
                  "Sleeper FF/The Other League/replacement-levels.json" \
                  "Sleeper FF/The Other League/trade-roi.json"
          if git diff --staged --quiet; then
            echo "✓ No changes — Phase 12 data files are already up to date."
          else
            git commit -m "chore(bot): weekly stats + trade ROI rebuild [automated]"
            git push
            echo "✓ Pushed Phase 12 data update."
          fi

      # Surface a broken link in the chain rather than letting a green tick imply
      # everything ran. The commit step above still publishes whatever DID rebuild.
      - name: Report data chain result
        if: always()
        run: |
          echo "stats-history:      ${{ steps.stats.outcome }}"
          echo "replacement-levels: ${{ steps.repl.outcome }}"
          echo "trade-roi:          ${{ steps.roi.outcome }}"
          if [ "${{ steps.stats.outcome }}" != "success" ] || \
             [ "${{ steps.repl.outcome }}" != "success" ] || \
             [ "${{ steps.roi.outcome }}" != "success" ]; then
            echo "::warning::Phase 12 data chain did not complete — see the step logs above."
          fi
